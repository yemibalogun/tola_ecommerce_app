{% extends "layouts/base.html" %}

{% block content %}
<section class="shop-page">
    <div class="container">
        <h1>Shop</h1>
        <p class="subtitle">
            Browse our latest products and best deals.
        </p>

        <div class="product-grid">
            {% for product in products %}
                <div class="product-card">
                    <div class="product-image">
                        
                        <img src="{{ url_for('static', filename=product.image.replace('admin/', '')) }}" 
                            alt="{{ product.name }}"
                            width="300" 
                            class="insta-image">
                    </div>

                    <div class="product-info">
                        <h3>{{ product.name }}</h3>
                        <p class="price">
                            ₦{{ "{:,.2f}".format(product.price) }}
                        </p>

                        <a href="{{ url_for('web.product_detail', slug=product.slug) }}" class="btn">
                            View Product
                        </a>

                    </div>
                </div>
            {% else %}
                <p>No products available at the moment.</p>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
