{% extends "admin/layouts/base.html" %}

{% block content %}
<h2>Orders</h2>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Status</th>
            <th>Total</th>
            <th>Date</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for order in orders %}
        <tr>
            <td>#{{ order.id }}</td>
            <td>{{ order.user.email }}</td>
            <td>{{ order.status }}</td>
            <td>{{ order.total_amount }}</td>
            <td>{{ order.created_at }}</td>
            <td>
                <a href="{{ url_for('admin_orders.view_order', order_id=order.id) }}">
                    View
                </a>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="6">No orders found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
