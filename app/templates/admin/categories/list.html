{% extends "admin/layouts/base.html" %}

{% block content %}
<h1>Categories</h1>
<a href="{{ url_for('admin_categories.create_category') }}" class="btn btn-success">Add Category</a>

<table class="table mt-3">
    <thead>
        <tr>
            <th>Name</th>
            <th>Slug</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for cat in categories %}
        <tr>
            <td>{{ cat.name }}</td>
            <td>{{ cat.slug }}</td>
            <td>
                <a href="{{ url_for('admin_categories.edit_category', category_id=cat.id) }}" class="btn btn-sm btn-warning">Edit</a>
                <form action="{{ url_for('admin_categories.delete_category', category_id=cat.id) }}" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
