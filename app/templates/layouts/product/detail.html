{% extends 'layouts/base.html' %}

{% block title %}{{ product.name }}{% endblock %}


{% block content %}
<section class="product-detail">
    <div class="container">

        <div class="product-detail-grid">

            <!-- Product Image -->
            <div class="product-image">
                <img src="{{ url_for('static', filename=product.image.replace('admin/', '')) }}" 
                     alt="{{ product.name }}"
                     width="300" 
                     class="insta-image">
                     
            </div>

            <!-- Product Info -->
            <div class="product-info">
                <h1>{{ product.name }}</h1>

                <p class="price">
                    ₦{{ "{:,.2f}".format(product.price) }}
                </p>

                {% if product.description %}
                    <div class="description">
                        {{ product.description }}
                    </div>
                {% endif %}

                <div class="actions">
                    <button class="btn-primary">
                        Add to Cart
                    </button>
                </div>
            </div>

        </div>

    </div>
</section>
{% endblock %}
